name: "Test Merge Requests"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - target/**
      - test/**
      - .dockerignore
      - .gitmodules
      - Dockerfile
      - Makefile
      - setup.sh

permissions:
  contents: read

jobs:
  build-image-amd64:
    name: "Build AMD64 Image"
    uses: ironashram/docker-mailserver/.github/workflows/generic_build.yml@master

  run-tests:
    name: "Test AMD64 Image"
    needs: build-image-amd64
    uses: ironashram/docker-mailserver/.github/workflows/generic_test.yml@master
    with:
      cache-key: ${{ needs.build-image-amd64.outputs.build-cache-key }}
